# Builds the examples under examples/ and runs their tests. They sit outside the library reactor,
# so this workflow installs the library first and then builds them against that install.
# It runs on every pull request and every push to main, so a library change that breaks an
# example fails here. Nothing here is published.

name: Examples

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install the library
        run: ./mvnw -B install -DskipTests
      - name: Build the examples
        run: ./mvnw -B -f examples/pom.xml verify

  notify:
    needs: [examples]
    if: failure() && github.ref == 'refs/heads/main'
    uses: embabel/embabel-build/.github/workflows/discord-notify.yml@main
    with:
      message: '❌ Examples failed'
    secrets: inherit

  notify-recovery:
    needs: [examples]
    if: success() && github.ref == 'refs/heads/main'
    # The recovery check reads this workflow's earlier runs.
    permissions:
      actions: read
    uses: embabel/embabel-build/.github/workflows/notify-recovery.yml@main
    with:
      branch: main
      caller_run_id: ${{ github.run_id }}
    secrets: inherit
