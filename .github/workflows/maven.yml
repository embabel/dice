# This workflow will build a Java / Kotlin project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  repository_dispatch:
    types: [agent-snapshots-deployed]
  push:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  # Detect whether the user guide changed - runs first, in parallel with nothing
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-changed: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'dice-user-guide/**/*.adoc'

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Configure Testcontainers
        run: |
          mkdir -p /home/runner
          echo "testcontainers.reuse.enable=true" > /home/runner/.testcontainers.properties
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # install is verify plus a copy of the library in the local repository, where the examples take it from.
        run: mvn -U -B test install
      # The examples must name the library's versions themselves. The release plugin's own commits move the
      # root version before anyone can move dice.version, so the check skips those two commits.
      # The subject is read from the checked-out commit, so a run that no push started sees it too.
      - name: Check the examples' versions
        run: |
          if git log -1 --format=%s | grep -q '^\[maven-release-plugin\]'; then
            echo "A release plugin commit. dice.version in examples/pom.xml moves in a later commit."
          else
            mvn -B -N -f examples/pom.xml initialize
          fi
      # The examples sit outside the library reactor. They build against the library this job installed,
      # whose version a release changes, so the root version is passed in.
      - name: Build the examples
        run: |
          DICE_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          mvn -B -f examples/pom.xml verify -Ddice.version="$DICE_VERSION"

  # Trigger the Publish Docs workflow if .adoc files changed (only on main branch push)
  trigger-docs:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.docs-changed == 'true'
    steps:
      - name: Trigger Publish Docs workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.repository }}
          event-type: publish-docs

  notify:
    needs: [build]
    if: always() && github.ref == 'refs/heads/main' && needs.build.result == 'failure'
    uses: embabel/embabel-build/.github/workflows/discord-notify.yml@main
    secrets: inherit

  notify-recovery:
    needs: [build]
    if: always() && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    permissions:
      actions: read
    uses: embabel/embabel-build/.github/workflows/notify-recovery.yml@main
    with:
      branch: main
      caller_run_id: ${{ github.run_id }}
    secrets: inherit
