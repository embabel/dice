# This workflow will build a Java / Kotlin project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  repository_dispatch:
    types: [agent-snapshots-deployed]
  push:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  # Detect whether the user guide changed - runs first, in parallel with nothing
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-changed: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'dice-user-guide/**/*.adoc'

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Configure Testcontainers
        run: |
          mkdir -p /home/runner
          echo "testcontainers.reuse.enable=true" > /home/runner/.testcontainers.properties
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -U -B test verify

  # Trigger the Publish Docs workflow if .adoc files changed (only on main branch push)
  trigger-docs:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.docs-changed == 'true'
    steps:
      - name: Trigger Publish Docs workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.repository }}
          event-type: publish-docs

  notify:
    needs: [build]
    if: failure() && github.ref == 'refs/heads/main'
    uses: embabel/embabel-build/.github/workflows/discord-notify.yml@main
    secrets: inherit

  notify-recovery:
    needs: [build]
    if: success() && github.ref == 'refs/heads/main'
    uses: embabel/embabel-build/.github/workflows/notify-recovery.yml@main
    with:
      branch: main
      caller_run_id: ${{ github.run_id }}
    secrets: inherit
